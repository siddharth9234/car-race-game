<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Racing Game - Web Frontend</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-emerald-500 selection:text-black">

    <!-- Header Section -->
    <header class="text-center my-2">
        <h1 class="text-3xl font-extrabold tracking-wider text-emerald-400 drop-shadow-[0_0_10px_rgba(52,211,153,0.5)]">
            🏎️ TERMINAL RACING ENGINE
        </h1>
        <p class="text-xs text-slate-400 mt-1">Mirroring exact C backend logic (`race.c`)</p>
    </header>

    <!-- Main Game Container -->
    <main class="flex flex-col items-center w-full max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-2xl">
        
        <!-- Status Bar -->
        <div class="flex flex-wrap justify-between items-center w-full bg-slate-950/80 border border-slate-800 px-4 py-3 rounded-xl mb-4 text-sm font-semibold">
            <div class="flex items-center space-x-2">
                <span class="text-slate-400">Position:</span>
                <span id="pos-display" class="text-cyan-400">[6, 5]</span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-slate-400">Heading:</span>
                <span id="heading-display" class="text-amber-400">^ (North)</span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-slate-400">Status:</span>
                <span id="status-display" class="text-emerald-400 animate-pulse">Running</span>
            </div>
        </div>

        <!-- ASCII Map Render Grid -->
        <div class="overflow-x-auto w-full bg-black/70 border border-slate-800 p-3 rounded-xl flex justify-center shadow-inner">
            <div id="game-grid" class="grid grid-cols-[repeat(30,minmax(0,1fr))] text-center font-mono text-xs md:text-sm leading-none gap-[1px]">
                <!-- Dynamically populated via JS -->
            </div>
        </div>

        <!-- Controls & Legend -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full mt-6">
            
            <!-- On-Screen D-Pad Controls for Mobile / Touch -->
            <div class="flex flex-col items-center justify-center bg-slate-950/50 border border-slate-800 p-4 rounded-xl">
                <span class="text-xs uppercase tracking-wider text-slate-400 mb-3 font-bold">Touch Controls</span>
                <div class="grid grid-cols-3 gap-2 w-48">
                    <div></div>
                    <button id="btn-w" class="bg-slate-800 hover:bg-slate-700 active:bg-emerald-600 text-slate-100 font-bold py-3 rounded-lg border border-slate-700 shadow transition active:scale-95 flex items-center justify-center">W</button>
                    <div></div>
                    <button id="btn-a" class="bg-slate-800 hover:bg-slate-700 active:bg-emerald-600 text-slate-100 font-bold py-3 rounded-lg border border-slate-700 shadow transition active:scale-95 flex items-center justify-center">A</button>
                    <button id="btn-q" class="bg-red-950/60 hover:bg-red-900/80 active:bg-red-700 text-red-300 font-bold py-3 rounded-lg border border-red-800/60 shadow transition active:scale-95 flex items-center justify-center text-xs">Q</button>
                    <button id="btn-d" class="bg-slate-800 hover:bg-slate-700 active:bg-emerald-600 text-slate-100 font-bold py-3 rounded-lg border border-slate-700 shadow transition active:scale-95 flex items-center justify-center">D</button>
                </div>
            </div>

            <!-- Keyboard Guide & Restart -->
            <div class="flex flex-col justify-between bg-slate-950/50 border border-slate-800 p-4 rounded-xl">
                <div>
                    <span class="text-xs uppercase tracking-wider text-slate-400 mb-2 font-bold block">Keyboard Bindings</span>
                    <ul class="text-xs space-y-1 text-slate-300">
                        <li><kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-emerald-400 border border-slate-700 font-mono">W</kbd> : Accelerate forward</li>
                        <li><kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-emerald-400 border border-slate-700 font-mono">A</kbd> : Toggle Left Turn (Cycle State)</li>
                        <li><kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-emerald-400 border border-slate-700 font-mono">D</kbd> : Toggle Right Turn (Cycle State)</li>
                        <li><kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-red-400 border border-slate-700 font-mono">Q</kbd> : Quit Game</li>
                    </ul>
                </div>
                <div class="mt-4">
                    <button id="btn-restart" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-slate-950 font-bold py-2.5 px-4 rounded-lg shadow-lg transition transform active:scale-95 flex items-center justify-center space-x-2">
    <!-- Game Logic Script (Identical to updated race.c_2.c) -->
    <script>
        // Initial C Map Layout (13x30 updated from race.c_2.c)
        const initialMap = [
            "##############################",
            "#                            #",
            "#  ########################  #",
            "#                         #  #",
            "#  #  ##################  #  #",
            "#  #  #                #  #  #",
            "#  #  #     F             #  #",
            "#  #  #                #  #  #",
            "#  #  ##################  #  #",
            "#  #                      #  #",
            "#  ########################  #",
            "#                            #",
            "##############################"
        ];

        let map = [];
        let c = []; // Collision matrix (1 = Wall, 2 = Finish)
        let cm = { x: 6, y: 5 };
        let a_toggle = 0;
        let d_toggle = 0;
        let gameState = "RUNNING"; // RUNNING, WON, CRASHED, QUIT

        // Initialize Game State matching updated C backend (13 rows)
        function initGame() {
            map = initialMap.map(row => row.split(''));
            c = Array(13).fill(0).map(() => Array(30).fill(0));

            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 30; j++) {
                    if (map[i][j] === '#') c[i][j] = 1;
                    else if (map[i][j] === 'F') c[i][j] = 2;
                }
            }

            cm = { x: 6, y: 5 };
            map[cm.x][cm.y] = '^';
            a_toggle = 0;
            d_toggle = 0;
            gameState = "RUNNING";
            render();
        }

        // Render the map and status with directional car emojis
        function render() {
            const gridEl = document.getElementById('game-grid');
            gridEl.innerHTML = '';
            // Update grid columns for 30 width
            gridEl.className = "grid grid-cols-[repeat(30,minmax(0,1fr))] text-center font-mono text-xs md:text-sm leading-none gap-[1px]";

            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 30; j++) {
                    const span = document.createElement('span');
                    const char = map[i][j];
                    
                    span.className = "w-4 h-4 md:w-5 md:h-5 flex items-center justify-center font-bold text-xs md:text-sm";

                    // Styling based on character type or car orientation with clear directional icons
                    if (char === '#') {
                        span.textContent = '#';
                        span.className += " bg-slate-800 text-slate-700 rounded-[2px]";
                    } else if (char === 'F') {
                        span.textContent = 'F';
                        span.className += " bg-emerald-950 text-emerald-400 font-extrabold animate-pulse";
                    } else if (['^', '>', 'v', '<'].includes(char)) {
                        // Use distinct icons/emojis for each direction to prevent any confusion
                        let carIcon = '🚗'; // default
                        if (char === '^') carIcon = '🚙'; // Heading North
                        else if (char === '>') carIcon = '🏎️'; // Heading East
                        else if (char === 'v') carIcon = '🚕'; // Heading South
                        else if (char === '<') carIcon = '🚐'; // Heading West

                        span.textContent = carIcon;
                        
                        // Add subtle rotational hint or glow depending on state
                        span.className += " bg-cyan-950/80 scale-125 drop-shadow-[0_0_8px_rgba(6,182,212,0.9)] z-10 transition-all duration-150";
                    } else {
                        span.textContent = ' ';
                        span.className += " text-slate-700";
                    }
                    gridEl.appendChild(span);
                }
            }

            // Update UI status bars
            document.getElementById('pos-display').textContent = `[${cm.x}, ${cm.y}]`;
            document.getElementById('heading-display').textContent = `${map[cm.x][cm.y]} (${getHeadingName(map[cm.x][cm.y])})`;
            
            const statusEl = document.getElementById('status-display');
            if (gameState === "RUNNING") {
                statusEl.textContent = "Running";
                statusEl.className = "text-emerald-400 animate-pulse";
            } else if (gameState === "WON") {
                statusEl.textContent = "Race Won! 🏆";
                statusEl.className = "text-amber-400 font-extrabold animate-bounce";
            } else if (gameState === "CRASHED") {
                statusEl.textContent = "Crashed! 💥";
                statusEl.className = "text-red-500 font-extrabold";
            } else if (gameState === "QUIT") {
                statusEl.textContent = "Game Closed";
                statusEl.className = "text-slate-500";
            }
        }

        function getHeadingName(symbol) {
            switch(symbol) {
                case '^': return "North";
                case '>': return "East";
                case 'v': return "South";
                case '<': return "West";
                return "";
            }
        }

        // Exact C Backend Move Logic
        function handleMove(m) {
            if (gameState !== "RUNNING") return;

            const currentCarChar = map[cm.x][cm.y];

            if (m === 'w') {
                map[cm.x][cm.y] = ' ';
                if (currentCarChar === '^') cm.x = cm.x - 1;
                else if (currentCarChar === '>') cm.y = cm.y + 1;
                else if (currentCarChar === 'v') cm.x = cm.x + 1;
                else if (currentCarChar === '<') cm.y = cm.y - 1;
                map[cm.x][cm.y] = currentCarChar;
            } 
            else if (m === 'q') {
                gameState = "QUIT";
                render();
                return;
            } 
            else if (m === 'a') {
                if (a_toggle === 0) {
                    map[cm.x][cm.y] = '^';
                    a_toggle = 1;
                } else if (a_toggle === 1) {
                    map[cm.x][cm.y] = 'v';
                    a_toggle = 0;
                }
            } 
            else if (m === 'd') {
                if (d_toggle === 0) {
                    map[cm.x][cm.y] = '<';
                    d_toggle = 1;
                } else if (d_toggle === 1) {
                    map[cm.x][cm.y] = '>';
                    d_toggle = 0;
                }
            }

            // Check Collision conditions
            if (c[cm.x][cm.y] === 1) {
                gameState = "CRASHED";
            } else if (c[cm.x][cm.y] === 2) {
                gameState = "WON";
            }

            render();
        }

        // Event Listeners for Keyboard
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 'd', 'q'].includes(key)) {
                e.preventDefault();
                handleMove(key);
            }
        });

        // Event Listeners for On-Screen Buttons
        document.getElementById('btn-w').addEventListener('click', () => handleMove('w'));
        document.getElementById('btn-a').addEventListener('click', () => handleMove('a'));
        document.getElementById('btn-d').addEventListener('click', () => handleMove('d'));
        document.getElementById('btn-q').addEventListener('click', () => handleMove('q'));
        document.getElementById('btn-restart').addEventListener('click', initGame);

        // Run on load
        window.onload = initGame;
    </script>
</body>
</html>
